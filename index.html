<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Added maximum-scale=1.0 and user-scalable=no to prevent zooming issues on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DocScan Pro - Mobile</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-dark: #121826;
      --bg-card: #1b2436;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e3a52;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Mobile viewport height fix */
      overflow: hidden;
    }

    /* Navbar */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      color: #38bdf8;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s ease;
      font-size: 0.9rem;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-icon-only { padding: 8px 12px; }

    /* Layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar / Bottom Sheet for Controls */
    .controls-panel {
      width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      transition: transform 0.3s ease;
      z-index: 5;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      /* hide scrollbar */
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: #26334d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      transition: 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .filter-btn.active, .filter-btn:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    /* Main Preview Area */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #0f172a;
      position: relative;
      overflow: auto;
    }

    .canvas-wrapper {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Bottom Thumbnail Carousel */
    .thumbnails-bar {
      height: 90px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 10px 15px;
      gap: 12px;
      overflow-x: auto;
      z-index: 10;
    }

    .thumb-card {
      position: relative;
      height: 60px;
      width: 45px;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      background: #000;
    }

    .thumb-card.active { border-color: var(--accent); }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-card .badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      font-size: 0.55rem;
      padding: 2px 4px;
      border-radius: 2px;
    }

    /* Modal for Web Camera */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .modal video {
      max-width: 100%;
      max-height: 80vh;
      background: #000;
    }

    .camera-controls {
      display: flex;
      gap: 16px;
      position: absolute;
      bottom: 30px;
    }

    .capture-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: 4px solid white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .capture-btn:active {
      background: rgba(255, 255, 255, 0.8);
    }

    .close-cam-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
    }
    .empty-state i { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; color: #38bdf8; }
    .empty-state p { margin-top: 10px; font-size: 0.9rem; max-width: 250px; line-height: 1.4; }

    /* Mobile Floating Action Button (FAB) */
    .mobile-fab-container {
      display: none;
      position: absolute;
      bottom: 20px;
      right: 20px;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .fab {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .fab.secondary {
      width: 48px;
      height: 48px;
      background: var(--bg-card);
      color: var(--text);
      font-size: 1.2rem;
      align-self: flex-end;
    }

    /* Edit Toggle for Mobile */
    .edit-toggle-btn {
      display: none;
    }

    /* ========================================= */
    /* Responsive Design for Mobile (max-width: 768px) */
    /* ========================================= */
    @media (max-width: 768px) {
      header {
        padding: 10px 15px;
      }
      
      .header-actions .btn-text { display: none; } /* Hide text on header buttons */
      .header-actions .btn { padding: 8px 12px; }

      .app-container {
        flex-direction: column-reverse; /* Preview on top, controls on bottom when open */
      }

      /* Make sidebar act as a bottom sheet for controls */
      .controls-panel {
        width: 100%;
        height: 45vh;
        border-right: none;
        border-top: 1px solid var(--border);
        position: absolute;
        bottom: 0;
        left: 0;
        transform: translateY(100%); /* Hidden by default on mobile */
        padding: 15px;
        gap: 15px;
      }

      .controls-panel.open {
        transform: translateY(0);
      }

      .preview-area {
        padding-bottom: 20px;
      }

      .edit-toggle-btn {
        display: flex; /* Show edit toggle button on mobile */
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        border-radius: 20px;
        padding: 8px 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      }

      /* Hide capture buttons from sidebar on mobile, use FABs instead */
      .controls-panel > div:first-child {
        display: none;
      }

      .mobile-fab-container {
        display: flex; /* Show FABs on mobile */
      }
      
      /* Adjust thumbnails bar for mobile */
      .thumbnails-bar {
        padding: 8px 10px;
        height: 80px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-file-contract"></i>
      <span>DocScan Pro</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-icon-only" id="clearAllBtn" title="Clear All">
        <i class="fa-solid fa-trash"></i> <span class="btn-text">Clear</span>
      </button>
      <button class="btn btn-success" id="exportPdfBtn" title="Download PDF">
        <i class="fa-solid fa-file-pdf"></i> <span class="btn-text">Export PDF</span>
      </button>
    </div>
  </header>

  <div class="app-container">
    
    <!-- Controls Panel (Bottom Sheet on Mobile, Sidebar on Desktop) -->
    <aside class="controls-panel" id="controlsPanel">
      <!-- Hidden on mobile, shown on desktop -->
      <div>
        <div class="section-title">1. Capture / Upload</div>
        <div class="input-group">
          <button class="btn" id="openCamBtnDesktop"><i class="fa-solid fa-camera"></i> Take Photo</button>
          <button class="btn btn-secondary" id="uploadBtnDesktop"><i class="fa-solid fa-upload"></i> Upload Image</button>
        </div>
      </div>

      <div>
        <div class="section-title">Filters</div>
        <div class="filter-scroll">
          <button class="filter-btn active" data-filter="magic_color">✨ Magic Color</button>
          <button class="filter-btn" data-filter="magic_bw">📄 Magic Pro B&W</button>
          <button class="filter-btn" data-filter="sharpen">🔍 Sharpen</button>
          <button class="filter-btn" data-filter="original">Original</button>
          <button class="filter-btn" data-filter="grayscale">Grayscale</button>
          <button class="filter-btn" data-filter="lighten">Lighten</button>
        </div>
      </div>

      <div>
        <div class="section-title">Adjustments</div>
        <div class="input-group">
          <div class="slider-group">
            <label>Brightness <span id="valBrightness">0</span></label>
            <input type="range" id="sliderBrightness" min="-100" max="100" value="0" />
          </div>
          <div class="slider-group">
            <label>Contrast <span id="valContrast">0</span></label>
            <input type="range" id="sliderContrast" min="-100" max="100" value="0" />
          </div>
          <div class="slider-group">
            <label>B&W Threshold <span id="valThreshold">128</span></label>
            <input type="range" id="sliderThreshold" min="50" max="200" value="128" />
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">Rotate</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" style="flex:1" id="rotateLeftBtn"><i class="fa-solid fa-rotate-left"></i> -90°</button>
          <button class="btn btn-secondary" style="flex:1" id="rotateRightBtn"><i class="fa-solid fa-rotate-right"></i> +90°</button>
        </div>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="preview-area">
      <div id="emptyState" class="empty-state">
        <i class="fa-solid fa-scanner"></i>
        <h2>Tap to Scan</h2>
        <p>Use the camera or upload images to start creating your document.</p>
      </div>

      <div class="canvas-wrapper" id="canvasWrapper" style="display: none;">
        <canvas id="mainCanvas"></canvas>
      </div>

      <!-- Mobile Edit Toggle -->
      <button class="btn btn-secondary edit-toggle-btn" id="editToggleBtn" style="display: none;">
        <i class="fa-solid fa-sliders"></i> Adjust Page
      </button>

      <!-- Mobile FABs for capturing -->
      <div class="mobile-fab-container" id="mobileFabs">
        <button class="fab secondary" id="uploadBtnMobile" title="Upload Image">
          <i class="fa-solid fa-image"></i>
        </button>
        <button class="fab" id="openCamBtnMobile" title="Take Photo">
          <i class="fa-solid fa-camera"></i>
        </button>
      </div>
      
      <!-- Shared File Input -->
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </main>
  </div>

  <!-- Bottom Page Carousel -->
  <div class="thumbnails-bar" id="thumbBar"></div>

  <!-- Camera Modal -->
  <div class="modal" id="camModal">
    <button class="close-cam-btn" id="closeCamBtn"><i class="fa-solid fa-xmark"></i></button>
    <video id="webcamVideo" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="capture-btn" id="captureSnapBtn"></button>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    // State management
    let pages = []; 
    let activeIndex = -1;
    let isControlsOpen = false; // Mobile bottom sheet state

    // DOM Elements
    const fileInput = document.getElementById('fileInput');

    // Capture Buttons (Desktop & Mobile)
    const uploadBtnDesktop = document.getElementById('uploadBtnDesktop');
    const openCamBtnDesktop = document.getElementById('openCamBtnDesktop');
    const uploadBtnMobile = document.getElementById('uploadBtnMobile');
    const openCamBtnMobile = document.getElementById('openCamBtnMobile');

    // Mobile UI specific
    const editToggleBtn = document.getElementById('editToggleBtn');
    const controlsPanel = document.getElementById('controlsPanel');
    const mobileFabs = document.getElementById('mobileFabs');

    // Camera UI
    const camModal = document.getElementById('camModal');
    const webcamVideo = document.getElementById('webcamVideo');
    const captureSnapBtn = document.getElementById('captureSnapBtn');
    const closeCamBtn = document.getElementById('closeCamBtn');

    // Canvas & Preview
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const emptyState = document.getElementById('emptyState');
    const thumbBar = document.getElementById('thumbBar');

    // Actions
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    // Controls
    const sliderBrightness = document.getElementById('sliderBrightness');
    const sliderContrast = document.getElementById('sliderContrast');
    const sliderThreshold = document.getElementById('sliderThreshold');
    const valBrightness = document.getElementById('valBrightness');
    const valContrast = document.getElementById('valContrast');
    const valThreshold = document.getElementById('valThreshold');

    let stream = null;

    // --- Initialization & UI Binding ---

    // Handle Uploads
    const triggerUpload = () => fileInput.click();
    if(uploadBtnDesktop) uploadBtnDesktop.onclick = triggerUpload;
    if(uploadBtnMobile) uploadBtnMobile.onclick = triggerUpload;

    fileInput.onchange = (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => addPage(img);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
      fileInput.value = '';
    };

    // Handle Camera
    const openCamera = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" }, 
          audio: false 
        });
        webcamVideo.srcObject = stream;
        camModal.style.display = 'flex';
      } catch (err) {
        alert("Camera access denied or not available on your device.");
      }
    };
    if(openCamBtnDesktop) openCamBtnDesktop.onclick = openCamera;
    if(openCamBtnMobile) openCamBtnMobile.onclick = openCamera;

    const stopCamera = () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      camModal.style.display = 'none';
    };
    closeCamBtn.onclick = stopCamera;

    captureSnapBtn.onclick = () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = webcamVideo.videoWidth;
      tempCanvas.height = webcamVideo.videoHeight;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(webcamVideo, 0, 0);
      
      const img = new Image();
      img.onload = () => {
        addPage(img);
        stopCamera();
      };
      img.src = tempCanvas.toDataURL('image/jpeg');
    };

    // Mobile Bottom Sheet Toggle
    if(editToggleBtn) {
      editToggleBtn.onclick = () => {
        isControlsOpen = !isControlsOpen;
        if(isControlsOpen) {
          controlsPanel.classList.add('open');
          editToggleBtn.innerHTML = '<i class="fa-solid fa-check"></i> Done';
          editToggleBtn.classList.replace('btn-secondary', 'btn-success');
        } else {
          controlsPanel.classList.remove('open');
          editToggleBtn.innerHTML = '<i class="fa-solid fa-sliders"></i> Adjust Page';
          editToggleBtn.classList.replace('btn-success', 'btn-secondary');
        }
      };
    }


    // --- Core Application Logic ---

    function addPage(imgElement) {
      const pageData = {
        img: imgElement,
        filter: 'magic_color', // Default
        brightness: 10,
        contrast: 25,
        threshold: 128,
        rotation: 0
      };
      pages.push(pageData);
      activeIndex = pages.length - 1;
      renderThumbnails();
      loadActivePage();
      updateUIState();
    }

    function updateUIState() {
      const hasPages = pages.length > 0;
      if(hasPages) {
        emptyState.style.display = 'none';
        canvasWrapper.style.display = 'flex';
        // Show edit button on mobile if pages exist
        if(window.innerWidth <= 768) {
            editToggleBtn.style.display = 'flex';
        }
      } else {
        emptyState.style.display = 'block';
        canvasWrapper.style.display = 'none';
        editToggleBtn.style.display = 'none';
        controlsPanel.classList.remove('open');
        isControlsOpen = false;
      }
    }

    // Window resize handler to manage edit button visibility
    window.addEventListener('resize', () => {
       if(pages.length > 0 && window.innerWidth <= 768) {
           editToggleBtn.style.display = 'flex';
       } else {
           editToggleBtn.style.display = 'none';
           if(window.innerWidth > 768) {
               controlsPanel.classList.remove('open'); // Ensure it resets for desktop view
               isControlsOpen = false;
           }
       }
    });

    function loadActivePage() {
      if (activeIndex < 0 || activeIndex >= pages.length) {
        updateUIState();
        return;
      }
      updateUIState();

      const p = pages[activeIndex];
      sliderBrightness.value = p.brightness;
      sliderContrast.value = p.contrast;
      sliderThreshold.value = p.threshold;
      valBrightness.textContent = p.brightness;
      valContrast.textContent = p.contrast;
      valThreshold.textContent = p.threshold;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === p.filter);
      });

      processAndDraw();
    }

    // Image Processing
    function processAndDraw() {
      if (activeIndex < 0) return;
      const p = pages[activeIndex];
      const img = p.img;

      const isRotated = (p.rotation / 90) % 2 !== 0;
      const w = isRotated ? img.height : img.width;
      const h = isRotated ? img.width : img.height;

      // Downscale canvas for performance during editing if image is huge
      const MAX_DIM = 2000;
      let scale = 1;
      if (w > MAX_DIM || h > MAX_DIM) {
          scale = Math.min(MAX_DIM/w, MAX_DIM/h);
      }
      
      const targetW = Math.floor(w * scale);
      const targetH = Math.floor(h * scale);

      mainCanvas.width = targetW;
      mainCanvas.height = targetH;

      ctx.save();
      ctx.translate(targetW / 2, targetH / 2);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.scale(scale, scale);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();

      let imageData = ctx.getImageData(0, 0, targetW, targetH);
      let pixels = imageData.data;

      if (p.filter === 'sharpen') {
        imageData = applySharpen(ctx, imageData);
        pixels = imageData.data;
      }

      const b = parseInt(p.brightness);
      const c = parseInt(p.contrast);
      const contrastFactor = (259 * (c + 255)) / (255 * (259 - c));
      const thresh = parseInt(p.threshold);

      for (let i = 0; i < pixels.length; i += 4) {
        let r = pixels[i];
        let g = pixels[i + 1];
        let bVal = pixels[i + 2];

        let luma = 0.299 * r + 0.587 * g + 0.114 * bVal;

        if (p.filter === 'magic_color') {
          let maxRGB = Math.max(r, g, bVal);
          if (luma > 150) {
            r = Math.min(255, r * 1.25 + 20);
            g = Math.min(255, g * 1.25 + 20);
            bVal = Math.min(255, bVal * 1.25 + 20);
          } else {
            r = Math.max(0, r * 0.85);
            g = Math.max(0, g * 0.85);
            bVal = Math.max(0, bVal * 0.85);
          }
        } else if (p.filter === 'magic_bw') {
          let val = luma >= thresh ? 255 : 0;
          r = g = bVal = val;
        } else if (p.filter === 'grayscale') {
          r = g = bVal = luma;
        } else if (p.filter === 'lighten') {
          r = Math.min(255, r + 40);
          g = Math.min(255, g + 40);
          bVal = Math.min(255, bVal + 40);
        }

        if (p.filter !== 'magic_bw') {
          r = contrastFactor * (r + b - 128) + 128;
          g = contrastFactor * (g + b - 128) + 128;
          bVal = contrastFactor * (bVal + b - 128) + 128;
        }

        pixels[i] = Math.min(255, Math.max(0, r));
        pixels[i + 1] = Math.min(255, Math.max(0, g));
        pixels[i + 2] = Math.min(255, Math.max(0, bVal));
      }

      ctx.putImageData(imageData, 0, 0);
      updateActiveThumbnail();
    }

    function applySharpen(ctx, imageData) {
      const w = imageData.width;
      const h = imageData.height;
      const src = imageData.data;
      const output = ctx.createImageData(w, h);
      const dst = output.data;

      const kernel = [ 0, -1,  0, -1,  5, -1, 0, -1,  0 ];

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          let r = 0, g = 0, b = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const px = (y + ky) * w + (x + kx);
              const weight = kernel[(ky + 1) * 3 + (kx + 1)];
              r += src[px * 4] * weight;
              g += src[px * 4 + 1] * weight;
              b += src[px * 4 + 2] * weight;
            }
          }
          const idx = (y * w + x) * 4;
          dst[idx] = Math.min(255, Math.max(0, r));
          dst[idx + 1] = Math.min(255, Math.max(0, g));
          dst[idx + 2] = Math.min(255, Math.max(0, b));
          dst[idx + 3] = 255;
        }
      }
      return output;
    }

    // Controls Events
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        if (activeIndex < 0) return;
        pages[activeIndex].filter = btn.dataset.filter;
        if (btn.dataset.filter === 'magic_bw') {
          pages[activeIndex].contrast = 40;
        }
        loadActivePage();
      };
    });

    sliderBrightness.oninput = (e) => {
      valBrightness.textContent = e.target.value;
      if (activeIndex >= 0) {
        pages[activeIndex].brightness = e.target.value;
        processAndDraw();
      }
    };

    sliderContrast.oninput = (e) => {
      valContrast.textContent = e.target.value;
      if (activeIndex >= 0) {
        pages[activeIndex].contrast = e.target.value;
        processAndDraw();
      }
    };

    sliderThreshold.oninput = (e) => {
      valThreshold.textContent = e.target.value;
      if (activeIndex >= 0) {
        pages[activeIndex].threshold = e.target.value;
        processAndDraw();
      }
    };

    document.getElementById('rotateLeftBtn').onclick = () => {
      if (activeIndex < 0) return;
      pages[activeIndex].rotation = (pages[activeIndex].rotation - 90 + 360) % 360;
      processAndDraw();
    };

    document.getElementById('rotateRightBtn').onclick = () => {
      if (activeIndex < 0) return;
      pages[activeIndex].rotation = (pages[activeIndex].rotation + 90) % 360;
      processAndDraw();
    };

    // Thumbnails
    function renderThumbnails() {
      thumbBar.innerHTML = '';
      pages.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `thumb-card ${idx === activeIndex ? 'active' : ''}`;
        
        const img = document.createElement('img');
        img.src = p.img.src; // Init with original, updated later
        
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = `P${idx + 1}`;

        card.appendChild(img);
        card.appendChild(badge);

        card.onclick = () => {
          activeIndex = idx;
          renderThumbnails();
          loadActivePage();
        };

        thumbBar.appendChild(card);
      });
    }

    function updateActiveThumbnail() {
      const activeCard = thumbBar.children[activeIndex];
      if (activeCard) {
        const img = activeCard.querySelector('img');
        img.src = mainCanvas.toDataURL('image/jpeg', 0.2); // Low quality for thumbnail
      }
    }

    clearAllBtn.onclick = () => {
      if (confirm('Delete all scanned pages?')) {
        pages = [];
        activeIndex = -1;
        renderThumbnails();
        updateUIState();
      }
    };

    // PDF Export
    exportPdfBtn.onclick = () => {
      if (pages.length === 0) {
        alert('Please add at least one scanned image before exporting.');
        return;
      }

      const pdf = new jsPDF({
        orientation: 'p',
        unit: 'mm',
        format: 'a4'
      });

      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();

      // Save current active index to restore later
      const originalIndex = activeIndex;

      pages.forEach((p, i) => {
        if (i > 0) pdf.addPage();
        
        activeIndex = i;
        processAndDraw(); // Re-render at full resolution (based on our scale logic)
        const imgData = mainCanvas.toDataURL('image/jpeg', 0.95);

        const imgProps = pdf.getImageProperties(imgData);
        const ratio = imgProps.width / imgProps.height;
        let printW = pdfWidth;
        let printH = pdfWidth / ratio;

        if (printH > pdfHeight) {
          printH = pdfHeight;
          printW = pdfHeight * ratio;
        }

        const xOffset = (pdfWidth - printW) / 2;
        const yOffset = (pdfHeight - printH) / 2;

        pdf.addImage(imgData, 'JPEG', xOffset, yOffset, printW, printH);
      });

      // Restore view
      activeIndex = originalIndex;
      loadActivePage();

      pdf.save(`DocScan_${new Date().getTime()}.pdf`);
    };

    // Initial state
    updateUIState();
  </script>
</body>
</html>
