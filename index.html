<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocScan Pro - CamScanner Web App</title>
  <!-- jsPDF CDN for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-dark: #121826;
      --bg-card: #1b2436;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e3a52;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Navbar */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      color: #38bdf8;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s ease;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }

    /* Layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar - Capture & Controls */
    .sidebar {
      width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .filter-btn {
      background: #26334d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    /* Main Preview Area */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0f172a;
      position: relative;
      overflow: auto;
    }

    .canvas-wrapper {
      max-width: 100%;
      max-height: 80vh;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      max-width: 100%;
      max-height: 80vh;
      display: block;
      object-fit: contain;
    }

    /* Bottom Thumbnail Carousel */
    .thumbnails-bar {
      height: 110px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 10px 20px;
      gap: 12px;
      overflow-x: auto;
    }

    .thumb-card {
      position: relative;
      height: 80px;
      width: 60px;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      background: #000;
    }

    .thumb-card.active { border-color: var(--accent); }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-card .badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      font-size: 0.65rem;
      padding: 2px 4px;
      border-radius: 2px;
    }

    /* Modal for Web Camera */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .modal video {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 8px;
      background: #000;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-file-contract"></i>
      <span>DocScan Pro</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" id="clearAllBtn"><i class="fa-solid fa-trash"></i> Clear All</button>
      <button class="btn btn-success" id="exportPdfBtn"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar Controls -->
    <aside class="sidebar">
      <div>
        <div class="section-title">1. Capture / Upload</div>
        <div class="input-group">
          <button class="btn" id="openCamBtn"><i class="fa-solid fa-camera"></i> Take Photo</button>
          <button class="btn btn-secondary" id="uploadBtn"><i class="fa-solid fa-upload"></i> Upload Image(s)</button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
        </div>
      </div>

      <div>
        <div class="section-title">2. Preset Filters</div>
        <div class="filter-grid">
          <button class="filter-btn active" data-filter="original">Original</button>
          <button class="filter-btn" data-filter="magic_color">✨ Magic Color</button>
          <button class="filter-btn" data-filter="magic_bw">📄 Magic Pro B&W</button>
          <button class="filter-btn" data-filter="sharpen">🔍 De-blur / Clear</button>
          <button class="filter-btn" data-filter="grayscale">Grayscale</button>
          <button class="filter-btn" data-filter="lighten">Lighten Background</button>
        </div>
      </div>

      <div>
        <div class="section-title">3. Fine Adjustments</div>
        <div class="input-group">
          <div class="slider-group">
            <label>Brightness <span id="valBrightness">0</span></label>
            <input type="range" id="sliderBrightness" min="-100" max="100" value="0" />
          </div>
          <div class="slider-group">
            <label>Contrast <span id="valContrast">0</span></label>
            <input type="range" id="sliderContrast" min="-100" max="100" value="0" />
          </div>
          <div class="slider-group">
            <label>B&W Threshold <span id="valThreshold">128</span></label>
            <input type="range" id="sliderThreshold" min="50" max="200" value="128" />
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">4. Transformations</div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" style="flex:1" id="rotateLeftBtn"><i class="fa-solid fa-rotate-left"></i> -90°</button>
          <button class="btn btn-secondary" style="flex:1" id="rotateRightBtn"><i class="fa-solid fa-rotate-right"></i> +90°</button>
        </div>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="preview-area">
      <div id="emptyState" class="empty-state">
        <i class="fa-solid fa-scanner"></i>
        <h2>No Document Loaded</h2>
        <p>Use the sidebar to snap a photo or upload document images.</p>
      </div>

      <div class="canvas-wrapper" id="canvasWrapper" style="display: none;">
        <canvas id="mainCanvas"></canvas>
      </div>
    </main>
  </div>

  <!-- Bottom Page Carousel -->
  <div class="thumbnails-bar" id="thumbBar"></div>

  <!-- Camera Modal -->
  <div class="modal" id="camModal">
    <video id="webcamVideo" autoplay playsinline></video>
    <div style="display: flex; gap: 12px;">
      <button class="btn btn-success" id="captureSnapBtn"><i class="fa-solid fa-circle-dot"></i> Capture</button>
      <button class="btn btn-danger" id="closeCamBtn">Close</button>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    // State management
    let pages = []; // Array of objects { originalImg, filter, brightness, contrast, threshold, rotation }
    let activeIndex = -1;

    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const openCamBtn = document.getElementById('openCamBtn');
    const camModal = document.getElementById('camModal');
    const webcamVideo = document.getElementById('webcamVideo');
    const captureSnapBtn = document.getElementById('captureSnapBtn');
    const closeCamBtn = document.getElementById('closeCamBtn');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const emptyState = document.getElementById('emptyState');
    const thumbBar = document.getElementById('thumbBar');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    // Controls
    const sliderBrightness = document.getElementById('sliderBrightness');
    const sliderContrast = document.getElementById('sliderContrast');
    const sliderThreshold = document.getElementById('sliderThreshold');
    const valBrightness = document.getElementById('valBrightness');
    const valContrast = document.getElementById('valContrast');
    const valThreshold = document.getElementById('valThreshold');

    let stream = null;

    // File Upload Handler
    uploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => addPage(img);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
      fileInput.value = '';
    };

    // Camera Handler
    openCamBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        webcamVideo.srcObject = stream;
        camModal.style.display = 'flex';
      } catch (err) {
        alert("Camera access denied or not available on your device.");
      }
    };

    closeCamBtn.onclick = stopCamera;

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      camModal.style.display = 'none';
    }

    captureSnapBtn.onclick = () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = webcamVideo.videoWidth;
      tempCanvas.height = webcamVideo.videoHeight;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(webcamVideo, 0, 0);
      
      const img = new Image();
      img.onload = () => {
        addPage(img);
        stopCamera();
      };
      img.src = tempCanvas.toDataURL('image/jpeg');
    };

    // Page Management
    function addPage(imgElement) {
      const pageData = {
        img: imgElement,
        filter: 'magic_color', // Default filter like CamScanner
        brightness: 10,
        contrast: 25,
        threshold: 128,
        rotation: 0
      };
      pages.push(pageData);
      activeIndex = pages.length - 1;
      renderThumbnails();
      loadActivePage();
    }

    function loadActivePage() {
      if (activeIndex < 0 || activeIndex >= pages.length) {
        emptyState.style.display = 'block';
        canvasWrapper.style.display = 'none';
        return;
      }
      emptyState.style.display = 'none';
      canvasWrapper.style.display = 'flex';

      const p = pages[activeIndex];
      sliderBrightness.value = p.brightness;
      sliderContrast.value = p.contrast;
      sliderThreshold.value = p.threshold;
      valBrightness.textContent = p.brightness;
      valContrast.textContent = p.contrast;
      valThreshold.textContent = p.threshold;

      // Update filter UI buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === p.filter);
      });

      processAndDraw();
    }

    // Image Processing Engine
    function processAndDraw() {
      if (activeIndex < 0) return;
      const p = pages[activeIndex];
      const img = p.img;

      // Calculate canvas dimensions considering rotation
      const isRotated = (p.rotation / 90) % 2 !== 0;
      const w = isRotated ? img.height : img.width;
      const h = isRotated ? img.width : img.height;

      mainCanvas.width = w;
      mainCanvas.height = h;

      // Draw original rotated image to canvas
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();

      // Read pixel data for manipulation
      let imageData = ctx.getImageData(0, 0, w, h);
      let pixels = imageData.data;

      // Apply convolution matrix if sharpening
      if (p.filter === 'sharpen') {
        imageData = applySharpen(ctx, imageData);
        pixels = imageData.data;
      }

      const b = parseInt(p.brightness);
      const c = parseInt(p.contrast);
      const contrastFactor = (259 * (c + 255)) / (255 * (259 - c));
      const thresh = parseInt(p.threshold);

      for (let i = 0; i < pixels.length; i += 4) {
        let r = pixels[i];
        let g = pixels[i + 1];
        let bVal = pixels[i + 2];

        // 1. Grayscale luminance calculation
        let luma = 0.299 * r + 0.587 * g + 0.114 * bVal;

        // 2. Filter-specific transformations
        if (p.filter === 'magic_color') {
          // CamScanner Magic Color: boost white background, crisp dark text, enhance color saturation
          let maxRGB = Math.max(r, g, bVal);
          let minRGB = Math.min(r, g, bVal);
          
          // Background whitening threshold
          if (luma > 150) {
            r = Math.min(255, r * 1.25 + 20);
            g = Math.min(255, g * 1.25 + 20);
            bVal = Math.min(255, bVal * 1.25 + 20);
          } else {
            // Darken ink text
            r = Math.max(0, r * 0.85);
            g = Math.max(0, g * 0.85);
            bVal = Math.max(0, bVal * 0.85);
          }
        } else if (p.filter === 'magic_bw') {
          // High-contrast clean Black & White
          let val = luma >= thresh ? 255 : 0;
          r = g = bVal = val;
        } else if (p.filter === 'grayscale') {
          r = g = bVal = luma;
        } else if (p.filter === 'lighten') {
          // Whiten greyish camera shadows
          r = Math.min(255, r + 40);
          g = Math.min(255, g + 40);
          bVal = Math.min(255, bVal + 40);
        }

        // 3. Brightness & Contrast fine tuning
        if (p.filter !== 'magic_bw') {
          r = contrastFactor * (r + b - 128) + 128;
          g = contrastFactor * (g + b - 128) + 128;
          bVal = contrastFactor * (bVal + b - 128) + 128;
        }

        pixels[i] = Math.min(255, Math.max(0, r));
        pixels[i + 1] = Math.min(255, Math.max(0, g));
        pixels[i + 2] = Math.min(255, Math.max(0, bVal));
      }

      ctx.putImageData(imageData, 0, 0);
      updateActiveThumbnail();
    }

    // 3x3 Sharpen Kernel convolution matrix
    function applySharpen(ctx, imageData) {
      const w = imageData.width;
      const h = imageData.height;
      const src = imageData.data;
      const output = ctx.createImageData(w, h);
      const dst = output.data;

      // Kernel: High-pass sharpening matrix
      const kernel = [
         0, -1,  0,
        -1,  5, -1,
         0, -1,  0
      ];

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          let r = 0, g = 0, b = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const px = (y + ky) * w + (x + kx);
              const weight = kernel[(ky + 1) * 3 + (kx + 1)];
              r += src[px * 4] * weight;
              g += src[px * 4 + 1] * weight;
              b += src[px * 4 + 2] * weight;
            }
          }
          const idx = (y * w + x) * 4;
          dst[idx] = Math.min(255, Math.max(0, r));
          dst[idx + 1] = Math.min(255, Math.max(0, g));
          dst[idx + 2] = Math.min(255, Math.max(0, b));
          dst[idx + 3] = 255;
        }
      }
      return output;
    }

    // Filter Buttons Listener
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        if (activeIndex < 0) return;
        pages[activeIndex].filter = btn.dataset.filter;
        
        // Auto-adjust default contrast for Magic Pro B&W
        if (btn.dataset.filter === 'magic_bw') {
          pages[activeIndex].contrast = 40;
        }
        
        loadActivePage();
      };
    });

    // Slider Event Listeners
    sliderBrightness.oninput = (e) => {
      valBrightness.textContent = e.target.value;
      if (activeIndex >= 0) {
        pages[activeIndex].brightness = e.target.value;
        processAndDraw();
      }
    };

    sliderContrast.oninput = (e) => {
      valContrast.textContent = e.target.value;
      if (activeIndex >= 0) {
        pages[activeIndex].contrast = e.target.value;
        processAndDraw();
      }
    };

    sliderThreshold.oninput = (e) => {
      valThreshold.textContent = e.target.value;
      if (activeIndex >= 0) {
        pages[activeIndex].threshold = e.target.value;
        processAndDraw();
      }
    };

    // Rotation Listeners
    document.getElementById('rotateLeftBtn').onclick = () => {
      if (activeIndex < 0) return;
      pages[activeIndex].rotation = (pages[activeIndex].rotation - 90 + 360) % 360;
      processAndDraw();
    };

    document.getElementById('rotateRightBtn').onclick = () => {
      if (activeIndex < 0) return;
      pages[activeIndex].rotation = (pages[activeIndex].rotation + 90) % 360;
      processAndDraw();
    };

    // Thumbnails & Carousel Rendering
    function renderThumbnails() {
      thumbBar.innerHTML = '';
      pages.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `thumb-card ${idx === activeIndex ? 'active' : ''}`;
        
        const img = document.createElement('img');
        img.src = p.img.src;
        
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = `P${idx + 1}`;

        card.appendChild(img);
        card.appendChild(badge);

        card.onclick = () => {
          activeIndex = idx;
          renderThumbnails();
          loadActivePage();
        };

        thumbBar.appendChild(card);
      });
    }

    function updateActiveThumbnail() {
      const activeCard = thumbBar.children[activeIndex];
      if (activeCard) {
        const img = activeCard.querySelector('img');
        img.src = mainCanvas.toDataURL('image/jpeg', 0.5);
      }
    }

    clearAllBtn.onclick = () => {
      if (confirm('Are you sure you want to delete all scanned pages?')) {
        pages = [];
        activeIndex = -1;
        renderThumbnails();
        loadActivePage();
      }
    };

    // PDF Export Engine
    exportPdfBtn.onclick = () => {
      if (pages.length === 0) {
        alert('Please add at least one scanned image before exporting.');
        return;
      }

      const pdf = new jsPDF({
        orientation: 'p',
        unit: 'mm',
        format: 'a4'
      });

      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();

      pages.forEach((p, i) => {
        if (i > 0) pdf.addPage();
        
        // Temporarily render each page canvas to data URL
        activeIndex = i;
        processAndDraw();
        const imgData = mainCanvas.toDataURL('image/jpeg', 0.95);

        const imgProps = pdf.getImageProperties(imgData);
        const ratio = imgProps.width / imgProps.height;
        let printW = pdfWidth;
        let printH = pdfWidth / ratio;

        if (printH > pdfHeight) {
          printH = pdfHeight;
          printW = pdfHeight * ratio;
        }

        const xOffset = (pdfWidth - printW) / 2;
        const yOffset = (pdfHeight - printH) / 2;

        pdf.addImage(imgData, 'JPEG', xOffset, yOffset, printW, printH);
      });

      pdf.save(`Scanned_Document_${new Date().toISOString().slice(0, 10)}.pdf`);
    };
  </script>
</body>
</html>
